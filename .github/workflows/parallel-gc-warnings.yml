name: Parallel GC compiler warnings

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gc-objects:
    name: ${{ matrix.compiler }}, ${{ matrix.mode }}, ${{ matrix.build }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [gil, ft]
        build: [release, debug]
    env:
      CC: ${{ matrix.compiler }}

    steps:
      - name: Check out project and CPython fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Record tested source pair
        uses: ./.github/actions/record-source
        with:
          artifact-name: gc-warnings-source-${{ matrix.compiler }}-${{ matrix.mode }}-${{ matrix.build }}
          build-flags: CC=${{ matrix.compiler }} --with-parallel-gc ${{ matrix.mode == 'ft' && '--disable-gil' || '' }} ${{ matrix.build == 'debug' && '--with-pydebug' || '' }}

      - name: Install build dependencies and Clang
        run: |
          sudo ./cpython/.github/workflows/posix-deps-apt.sh
          sudo apt-get -yq --no-install-recommends install clang

      - name: Configure an isolated build
        env:
          BUILD_MODE: ${{ matrix.mode }}
          BUILD_KIND: ${{ matrix.build }}
        run: |
          set -euo pipefail
          "$CC" --version | tee compiler.log
          options=(--with-parallel-gc)
          if [[ "$BUILD_MODE" == ft ]]; then options+=(--disable-gil); fi
          if [[ "$BUILD_KIND" == debug ]]; then options+=(--with-pydebug); fi
          mkdir build-gc-warnings
          cd build-gc-warnings
          ../cpython/configure "${options[@]}" 2>&1 | tee ../configure.log

      - name: Compile GC objects with focused unused-code errors
        run: |
          set -euo pipefail
          make -C build-gc-warnings -j2 \
              CFLAGS_NODIST='-Werror=unused-function -Werror=unused-variable' \
              Python/gc.o \
              Python/gc_free_threading.o \
              Python/gc_parallel.o \
              Python/gc_free_threading_parallel.o \
              2>&1 | tee gc-warnings.log

      - name: Retain compiler diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gc-warnings-logs-${{ matrix.compiler }}-${{ matrix.mode }}-${{ matrix.build }}
          path: |
            compiler.log
            configure.log
            build-gc-warnings/config.log
            gc-warnings.log
          if-no-files-found: warn
