name: Parallel GC matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GIL, parallel GC feature-on
            configure: --with-pydebug --with-parallel-gc
            parallel_gc: true
            free_threaded: false
          - name: Free-threaded, parallel GC feature-on
            configure: --disable-gil --with-pydebug --with-parallel-gc
            parallel_gc: true
            free_threaded: true
          - name: GIL, feature-off control
            configure: --with-pydebug
            parallel_gc: false
            free_threaded: false
          - name: Free-threaded, feature-off control
            configure: --disable-gil --with-pydebug
            parallel_gc: false
            free_threaded: true

    steps:
      - name: Check out project and CPython fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install CPython build dependencies
        run: sudo ./cpython/.github/workflows/posix-deps-apt.sh

      - name: Configure
        run: |
          mkdir build-ci
          cd build-ci
          ../cpython/configure ${{ matrix.configure }}

      - name: Build
        run: make -C build-ci -j2

      - name: Verify selected configuration
        env:
          EXPECTED_AVAILABLE: ${{ matrix.parallel_gc && '1' || '0' }}
          EXPECTED_FREE_THREADED: ${{ matrix.free_threaded && '1' || '0' }}
        run: |
          build-ci/python - <<'PY'
          import gc
          import os
          import sys

          config = gc.get_parallel_config()
          expected_available = os.environ["EXPECTED_AVAILABLE"] == "1"
          expected_free_threaded = os.environ["EXPECTED_FREE_THREADED"] == "1"
          assert config["available"] is expected_available, config
          assert sys._is_gil_enabled() is not expected_free_threaded
          assert config["enabled"] is False, config
          assert config["num_workers"] == 0, config
          if expected_available:
              gc.enable_parallel()
              config = gc.get_parallel_config()
              assert config["enabled"] is True, config
              assert config["num_workers"] == 16, config
              assert config["adaptive_workers"] == 4, config
          print(config)
          PY

      - name: Run affected-area tests
        env:
          PARALLEL_GC_AVAILABLE: ${{ matrix.parallel_gc && '1' || '0' }}
          FREE_THREADED: ${{ matrix.free_threaded && '1' || '0' }}
        run: |
          tests=(
            test_gc
            test_gc_ft_parallel
            test_gc_ws_deque
            test_gc_parallel
            test_gc_parallel_fork
            test_gc_parallel_properties
            test_capi.test_config
            test_capi.test_misc
            test_embed
          )
          if [[ "$FREE_THREADED" == "1" ]]; then
            tests+=(test_free_threading.test_gc)
          elif [[ "$PARALLEL_GC_AVAILABLE" == "1" ]]; then
            tests+=(test_gc_parallel_mark_alive)
          fi
          build-ci/python -m test -q --timeout=600 "${tests[@]}"

      - name: Install benchmark test dependencies
        run: |
          build-ci/python -m ensurepip
          build-ci/python -m pip install \
              --requirement pyperformance/pyperformance/requirements/requirements.txt

      - name: Run benchmark harness unit tests
        run: |
          build-ci/python -m unittest -v \
            benchmarks.test_container_traversal_benchmark \
            benchmarks.test_gc_perf_benchmark \
            benchmarks.test_pyperformance_support
